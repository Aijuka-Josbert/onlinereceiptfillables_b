<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fitwell Milling Systems — Document Book</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Arvo:wght@700&family=Inter:opsz@14..32&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome 6 (Free) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- ===== SIDEBAR ===== -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <p class="brand"><strong>Fitwell</strong> Milling Systems</p>
          <h1>Create your document</h1>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="tabs">
          <button class="tab active" data-doc="dn">
            <i class="fas fa-truck"></i> Delivery Note
          </button>
          <button class="tab" data-doc="rc">
            <i class="fas fa-receipt"></i> Receipt
          </button>
          <button class="tab" data-doc="pf">
            <i class="fas fa-file-invoice"></i> Proforma Invoice
          </button>
        </div>

        <!-- Letterhead -->
        <fieldset>
          <legend><i class="fas fa-building"></i> Letterhead</legend>
          <div class="field-group">
            <label>Company Name</label>
            <input id="hd-name" value="FITWELL MILLING SYSTEMS (U) LIMITED" />
          </div>
          <div class="field-group">
            <label>Company Logo (URL)</label>
            <input id="hd-logo" placeholder="https://example.com/logo.png" />
          </div>
          <div class="field-group">
            <label>Address</label>
            <input
              id="hd-addr"
              value="Plot 14, Kifumbira Rd, Ntinda, Kampala"
            />
          </div>
          <div class="field-group two-col">
            <div>
              <label>P.O. Box</label
              ><input id="hd-pobox" value="9021, Kampala, Uganda" />
            </div>
            <div>
              <label>Telephone</label
              ><input id="hd-phone" value="+256 701 220345 / +256 782 559011" />
            </div>
          </div>
          <div class="field-group">
            <label>Email</label>
            <input
              id="hd-email"
              value="info@fitwellmilling.co.ug  |  admin@fitwellmilling.co.ug"
            />
          </div>
          <div class="field-group two-col">
            <div>
              <label>TIN</label><input id="hd-tin" value="1012345678" />
            </div>
            <div>
              <label>Reg. No.</label
              ><input id="hd-reg" value="80020001234567" />
            </div>
          </div>
          <div class="field-group">
            <label>Website</label>
            <input id="hd-web" value="www.fitwellmilling.co.ug" />
          </div>
        </fieldset>

        <!-- Delivery Note -->
        <div id="panel-dn">
          <fieldset>
            <legend><i class="fas fa-file-signature"></i> Delivery Note</legend>
            <div class="field-group two-col">
              <div>
                <label>Document No.</label><input id="dn-no" value="001" />
              </div>
              <div><label>Date</label><input id="dn-date" type="date" /></div>
            </div>
            <div class="field-group">
              <label>Client Name</label>
              <input id="dn-client" placeholder="Client name" />
            </div>
            <div class="field-group">
              <label>Client Address</label>
              <input id="dn-client-addr" placeholder="Client address" />
            </div>
            <div class="field-group two-col">
              <div>
                <label>Contact Person</label
                ><input id="dn-contact" placeholder="Contact person" />
              </div>
              <div>
                <label>Phone Number</label
                ><input id="dn-phone" placeholder="Phone number" />
              </div>
            </div>
          </fieldset>
          <fieldset>
            <legend><i class="fas fa-list"></i> Items</legend>
            <div id="dn-rows"></div>
            <button class="add-row" id="dn-add-row">
              <i class="fas fa-plus-circle"></i> Add item
            </button>
          </fieldset>
          <fieldset>
            <legend>
              <i class="fas fa-calculator"></i> Totals &amp; Sign‑off
            </legend>
            <div class="check-row">
              <input type="checkbox" id="dn-vat" />
              <label style="margin: 0">Apply 18% VAT</label>
            </div>
            <div class="field-group">
              <label>Amount in words</label>
              <input
                id="dn-words"
                placeholder="e.g. Five hundred thousand shillings only"
              />
            </div>
            <div class="field-group two-col">
              <div><label>Delivered by</label><input id="dn-delby" /></div>
              <div><label>Received by</label><input id="dn-recby" /></div>
            </div>
          </fieldset>
        </div>

        <!-- Receipt -->
        <div id="panel-rc" style="display: none">
          <fieldset>
            <legend><i class="fas fa-receipt"></i> Receipt</legend>
            <div class="field-group two-col">
              <div>
                <label>Receipt No.</label><input id="rc-no" value="001" />
              </div>
              <div><label>Date</label><input id="rc-date" type="date" /></div>
            </div>
            <div class="field-group">
              <label>Received From</label>
              <input id="rc-from" placeholder="Client name" />
            </div>
            <div class="field-group">
              <label>Payment Description</label>
              <textarea
                id="rc-for"
                placeholder="Description of goods or service"
              ></textarea>
            </div>
            <div class="field-group">
              <label>Payment Method</label>
              <select id="rc-method">
                <option value="Cash">Cash</option>
                <option value="Cheque">Cheque</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Mobile Money">Mobile Money</option>
              </select>
            </div>
            <div class="field-group two-col">
              <div>
                <label>Cash / Cheque No.</label
                ><input id="rc-cash" value="Cash" />
              </div>
              <div><label>Balance</label><input id="rc-bal" value="NIL" /></div>
            </div>
            <div class="field-group">
              <label>Amount (UGX / USD)</label>
              <input id="rc-amt" placeholder="0" />
            </div>
            <div class="field-group">
              <label>Amount in words</label>
              <input
                id="rc-words"
                placeholder="e.g. Five hundred thousand shillings only"
              />
            </div>
            <div class="field-group">
              <label>Issued By</label>
              <input id="rc-issued" />
            </div>
          </fieldset>
        </div>

        <!-- Proforma Invoice -->
        <div id="panel-pf" style="display: none">
          <fieldset>
            <legend>
              <i class="fas fa-file-invoice"></i> Proforma Invoice
            </legend>
            <div class="field-group two-col">
              <div>
                <label>Invoice No.</label><input id="pf-no" value="001" />
              </div>
              <div><label>Date</label><input id="pf-date" type="date" /></div>
            </div>
            <div class="field-group">
              <label>M/s (Client)</label>
              <input id="pf-client" placeholder="Client name" />
            </div>
            <div class="field-group">
              <label>Client Address</label>
              <input id="pf-client-addr" placeholder="Client address" />
            </div>
          </fieldset>
          <fieldset>
            <legend><i class="fas fa-list"></i> Items</legend>
            <div id="pf-rows"></div>
            <button class="add-row" id="pf-add-row">
              <i class="fas fa-plus-circle"></i> Add item
            </button>
            <div class="check-row" style="margin-top: 12px">
              <input type="checkbox" id="pf-vat" />
              <label style="margin: 0">Apply 18% VAT</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>
              <i class="fas fa-file-contract"></i> Terms &amp; Contact
            </legend>
            <div class="field-group">
              <label>Payment Terms</label>
              <input id="pf-terms" value="Cash on delivery" />
            </div>
            <div class="field-group">
              <label>Contact Information</label>
              <input id="pf-contact" placeholder="Phone number" />
            </div>
            <div class="field-group">
              <label>Amount in words</label>
              <input
                id="pf-words"
                placeholder="e.g. Five hundred thousand shillings only"
              />
            </div>
          </fieldset>
        </div>

        <!-- Action buttons -->
        <div class="action-row">
          <button class="action-btn" id="btn-today">
            <i class="fas fa-calendar-day"></i> Today
          </button>
          <button class="action-btn" id="btn-reset">
            <i class="fas fa-undo-alt"></i> Reset
          </button>
          <button class="action-btn" id="btn-duplicate">
            <i class="fas fa-copy"></i> Duplicate
          </button>
          <button class="action-btn" id="btn-clear">
            <i class="fas fa-trash-alt"></i> Clear All
          </button>
        </div>
        <div class="action-row">
          <button class="action-btn" id="btn-dark">
            <i class="fas fa-moon"></i> Dark / Light
          </button>
          <button class="action-btn" id="btn-save">
            <i class="fas fa-save"></i> Save
          </button>
        </div>

        <button class="print-btn" id="btn-print">
          <i class="fas fa-print"></i> Print / Save as PDF
        </button>
        <p class="hint">
          Fill the fields on the left — the sheet on the right updates as you
          type. Use <strong>Print / Save as PDF</strong> for a clean copy.
          <br /><kbd>Ctrl+P</kbd> print · <kbd>Ctrl+S</kbd> save
        </p>
      </aside>

      <!-- ===== PREVIEW STAGE ===== -->
      <main class="stage" id="stage">
        <div class="paper-wrap">
          <div class="paper" id="paper"></div>
        </div>
      </main>
    </div>

    <script src="./assets/js/script.js"></script>
  </body>
</html>
